<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>P2P Video Call — IPv6 Direct</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e17;
    --surface: #131a2a;
    --border: #1e2d4a;
    --accent: #00e5ff;
    --danger: #ff4060;
    --success: #00e676;
    --warn: #ffab00;
    --text: #e0e6f0;
    --text-dim: #7b8ba6;
    --radius: 10px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 16px 12px 4px;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #status-bar {
    margin-top: 6px;
    font-size: .8rem;
    color: var(--text-dim);
    min-height: 1.4em;
  }

  .video-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .video-cell {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    aspect-ratio: 3/4;
  }
  .video-cell video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .video-label {
    position: absolute;
    bottom: 6px; left: 8px;
    font-size: .65rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent);
    background: #0009;
    padding: 2px 8px; border-radius: 4px;
  }

  .controls {
    padding: 8px 12px;
    display: flex; gap: 8px;
    justify-content: center;
    max-width: 600px; margin: 0 auto;
  }
  .btn {
    border: none; border-radius: 8px;
    padding: 12px 20px; font-size: .82rem; font-weight: 600;
    cursor: pointer; color: #fff;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.96); }
  .btn-orange { background: linear-gradient(135deg, #ff6d00, #ffab00); color: #0a0e17; }
  .btn-danger { background: linear-gradient(135deg, #d50000, #ff1744); }

  #log-box {
    margin: 8px auto 20px;
    max-width: 600px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 180px;
    overflow-y: auto;
    padding: 8px 10px;
    font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
    font-size: .68rem; line-height: 1.55;
    -webkit-overflow-scrolling: touch;
  }
  #log-box .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-info { color: var(--accent); }
  .log-ok   { color: var(--success); }
  .log-warn { color: var(--warn); }
  .log-err  { color: var(--danger); }
  .log-dim  { color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1>⚡ P2P Video Call</h1>
  <div id="status-bar">Starting…</div>
</header>

<div class="video-grid">
  <div class="video-cell">
    <video id="localVideo" autoplay playsinline muted></video>
    <span class="video-label">You</span>
  </div>
  <div class="video-cell">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <span class="video-label">Peer</span>
  </div>
</div>

<div class="controls">
  <button class="btn btn-orange" onclick="forcePlay()">▶ Force Play Video</button>
  <button class="btn btn-danger" onclick="hangUp()">✖ Hang Up</button>
</div>

<div id="log-box"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, deleteDoc, getDocs, updateDoc }
    from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyAuqH_up7SYlVO_lY-qpBJgq3I1w9k8GKc",
    authDomain: "sengudil.firebaseapp.com",
    projectId: "sengudil",
    storageBucket: "sengudil.firebasestorage.app",
    messagingSenderId: "447848722727",
    appId: "1:447848722727:web:eb54015cccc519db8bf902"
  });
  const db = getFirestore(app);

  const ROOM_ID   = 'call';
  const roomRef   = doc(db, 'rooms', ROOM_ID);
  const localVideo  = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const logBox      = document.getElementById('log-box');
  const statusBar   = document.getElementById('status-bar');

  let pc = null, localStream = null, unsubscribers = [];

  function log(msg, cls = 'log-dim') {
    const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = `[${ts}] ${msg}`;
    logBox.appendChild(el);
    logBox.scrollTop = logBox.scrollHeight;
  }
  function setStatus(msg) { statusBar.textContent = msg; }

  const rtcConfig = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ],
    iceTransportPolicy: 'all'
  };

  /* ── P2P Filter (block relays, allow all direct paths) ── */
  function installP2PFilter(conn) {
    const orig = conn.addIceCandidate.bind(conn);
    conn.addIceCandidate = function (c) {
      if (!c || !c.candidate || c.candidate === '') return orig(c);
      const raw = c.candidate;
      if (raw.includes('typ relay')) { log(`🚫 Blocked Relay (not P2P)`, 'log-err'); return Promise.resolve(); }
      const ip = raw.split(' ')[4] || '';
      const type = ip.includes(':') ? 'IPv6' : 'IPv4';
      log(`🚀 Injecting ${type} → ${ip}`, 'log-ok');
      return orig(c);
    };
    log('🛡️  P2P filter active — relays blocked, direct paths allowed', 'log-info');
  }

  /* ── Media ──────────────────────────────────── */
  async function acquireMedia() {
    if (localStream) return localStream;
    log('📸 Requesting camera & mic…', 'log-info');
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: true
    });
    localVideo.srcObject = localStream;
    log(`✅ Local media ready`, 'log-ok');
    return localStream;
  }

  /* ── Build Peer Connection ──────────────────── */
  function buildPC(candidateCollection) {
    if (pc) { pc.close(); pc = null; }
    pc = new RTCPeerConnection(rtcConfig);
    installP2PFilter(pc);

    pc.ontrack = (e) => {
      if (remoteVideo.srcObject !== e.streams[0]) {
        remoteVideo.srcObject = e.streams[0];
        log('📺 Remote stream attached', 'log-ok');
      }
    };

    const candCol = collection(roomRef, candidateCollection);
    pc.onicecandidate = (e) => {
      if (!e.candidate) return;
      const raw = e.candidate.candidate, ip = raw.split(' ')[4] || '';
      if (raw.includes('typ relay')) { log(`🚫 [Local] Blocked Relay`, 'log-err'); return; }
      const type = ip.includes(':') ? 'IPv6' : 'IPv4';
      log(`🧊 [Local] ${type} → ${ip}`, 'log-info');
      addDoc(candCol, e.candidate.toJSON());
    };

    pc.onicegatheringstatechange = () => log(`🔄 Gathering → ${pc.iceGatheringState}`, 'log-info');
    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      const cls = { checking:'log-warn', connected:'log-ok', completed:'log-ok',
                    disconnected:'log-err', failed:'log-err', closed:'log-err' }[s] || 'log-info';
      log(`🌐 ICE → ${s}`, cls);
      if (s === 'connected' || s === 'completed') setStatus('🟢 Connected!');
      if (s === 'failed') setStatus('🔴 Failed — no IPv6 path found');
    };
    pc.onconnectionstatechange = () => log(`🔗 Connection → ${pc.connectionState}`, 'log-info');

    return pc;
  }

  function listenCandidates(collectionName) {
    const unsub = onSnapshot(collection(roomRef, collectionName), (snap) => {
      snap.docChanges().forEach((ch) => {
        if (ch.type === 'added' && ch.doc.data().candidate) {
          log('📨 Remote candidate received', 'log-info');
          pc.addIceCandidate(new RTCIceCandidate(ch.doc.data()));
        }
      });
    });
    unsubscribers.push(unsub);
  }

  /* ── Clean previous room data ───────────────── */
  async function cleanRoom() {
    try {
      for (const sub of ['callerCandidates', 'calleeCandidates']) {
        const snap = await getDocs(collection(roomRef, sub));
        for (const d of snap.docs) await deleteDoc(d.ref);
      }
      await deleteDoc(roomRef);
    } catch (_) {}
  }

  /* ═══════════════════════════════════════════════
     AUTO-CONNECT — Trickle ICE (instant SDP, stream candidates)
     ═══════════════════════════════════════════════ */
  async function autoConnect() {
    try {
      log('═══════════════════════════════════════', 'log-dim');
      log('⚡ Auto-connect starting (trickle ICE)…', 'log-info');
      setStatus('Connecting…');

      const stream = await acquireMedia();
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists() || !roomSnap.data().offer) {
        /* ── CALLER (first device) ────────────── */
        log('📡 You are the CALLER (first device)', 'log-info');
        await cleanRoom();

        buildPC('callerCandidates');
        stream.getTracks().forEach(t => pc.addTrack(t, stream));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Publish offer IMMEDIATELY — no waiting for gathering
        await setDoc(roomRef, {
          offer: { type: offer.type, sdp: offer.sdp },
          createdAt: Date.now()
        });
        log('✅ Offer published instantly — candidates trickling…', 'log-ok');
        setStatus('Waiting for peer…');

        // Watch for the answer
        const unsub = onSnapshot(roomRef, async (snap) => {
          const data = snap.data();
          if (data?.answer && !pc.currentRemoteDescription) {
            log('📨 Answer received!', 'log-ok');
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            log('✅ Remote description set', 'log-ok');
          }
        });
        unsubscribers.push(unsub);
        listenCandidates('calleeCandidates');

      } else {
        /* ── CALLEE (second device) ───────────── */
        log('📥 You are the CALLEE (second device)', 'log-info');

        buildPC('calleeCandidates');
        stream.getTracks().forEach(t => pc.addTrack(t, stream));

        await pc.setRemoteDescription(new RTCSessionDescription(roomSnap.data().offer));
        log('✅ Remote offer applied', 'log-ok');

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        // Publish answer IMMEDIATELY — candidates trickle via Firestore
        await updateDoc(roomRef, {
          answer: { type: answer.type, sdp: answer.sdp }
        });
        log('✅ Answer published instantly — candidates trickling…', 'log-ok');
        setStatus('Handshake done — connecting…');

        listenCandidates('callerCandidates');
      }

    } catch (err) {
      log(`❌ ${err.message}`, 'log-err');
      setStatus('Error — check log.');
    }
  }

  /* ── Force Play ─────────────────────────────── */
  window.forcePlay = function () {
    log('▶ Force Play', 'log-info');
    remoteVideo.muted = false;
    const p = remoteVideo.play();
    if (p) p.then(() => log('✅ Playing with audio', 'log-ok'))
           .catch(() => { remoteVideo.muted = true; remoteVideo.play(); });
  };

  /* ── Hang Up ────────────────────────────────── */
  window.hangUp = async function () {
    log('📴 Hanging up…', 'log-warn');
    unsubscribers.forEach(fn => fn()); unsubscribers = [];
    if (pc) { pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    await cleanRoom();
    setStatus('Ended. Refresh to reconnect.');
    log('✅ Done.', 'log-ok');
  };

  /* ── Go ─────────────────────────────────────── */
  log('═══════════════════════════════════════', 'log-dim');
  log('⚡ P2P Video Call — Trickle ICE', 'log-info');
  log('🛡️  TURN relays blocked · Direct P2P only', 'log-info');
  log('═══════════════════════════════════════', 'log-dim');
  autoConnect();

</script>
</body>
</html>
