<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict IPv6 P2P Video Call 2</title>
    <!-- Include PeerJS Library via CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; margin: 20px; background: #f4f4f9; color: #333; }
        .video-container { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 20px; }
        video { width: 45%; max-width: 400px; min-height: 240px; background: #000; border-radius: 8px; transform: scaleX(-1); }
        .controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin-top: 10px; max-width: 90%; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #status { font-weight: bold; margin-top: 15px; color: #666; }
    </style>
</head>
<body>

    <h2>Strict IPv6 P2P Video Call</h2>
    <p>Testing true serverless P2P over cellular networks</p>

    <div class="controls">
        <div><strong>Your Peer ID:</strong> <span id="my-id" style="color:#007bff;">Generating...</span></div>
        <br>
        <input type="text" id="remote-id" placeholder="Paste Remote Peer ID here">
        <button id="call-btn">Start IPv6 Video Call</button>
        <div id="status">Status: Initializing connection...</div>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Video</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote Video</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const myIdSpan = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const callBtn = document.getElementById('call-btn');

        let localStream = null;
        let peer = null;

        // Configuration forcing Google's dual-stack STUN servers
        const strictIPv6Config = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ],
                iceTransportPolicy: 'all'
            }
        };

        // FIX 1: Initialize PeerJS immediately so 'peer' is NEVER undefined
        function initPeer() {
            peer = new Peer(strictIPv6Config);

            peer.on('open', (id) => {
                myIdSpan.innerText = id;
                statusDiv.innerText = "Status: Online! Requesting camera permissions...";
                requestCamera();
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                statusDiv.innerText = `PeerJS Error: ${err.type}`;
            });

            // Handle Incoming Call
            peer.on('call', (incomingCall) => {
                statusDiv.innerText = "Status: Incoming call! Stripping IPv4 metrics...";
                enforceIPv6Only(incomingCall.peerConnection);

                if (!localStream) {
                    statusDiv.innerText = "Error: Cannot answer. Camera stream not ready.";
                    return;
                }
                
                incomingCall.answer(localStream);
                setupStreamHandlers(incomingCall);
            });
        }

        // FIX 2: Decoupled camera request system
        async function requestCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localStream = stream;
                localVideo.srcObject = stream;
                statusDiv.innerText = "Status: Ready! Share your ID to start IPv6 P2P call.";
            } catch (err) {
                console.error("Camera Error:", err);
                statusDiv.innerHTML = `<span style='color:orange;'>Camera Warning: ${err.message}. (Please accept browser permission prompts)</span>`;
            }
        }

        // 3. Initiate Outbound Call
        callBtn.onclick = () => {
            const targetId = remoteIdInput.value.trim();
            if (!targetId) {
                alert("Please enter a valid Remote Peer ID");
                return;
            }
            if (!localStream) {
                alert("Please allow camera access before placing a call.");
                return;
            }

            statusDiv.innerText = "Status: Dialing peer and punching IPv6 firewalls...";
            const outboundCall = peer.call(targetId, localStream);
            
            enforceIPv6Only(outboundCall.peerConnection);
            setupStreamHandlers(outboundCall);
        };

        // 4. Attach video streams and handle connection states
        function setupStreamHandlers(call) {
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerText = "Status: Connected! Live direct P2P stream established.";
            });

            call.on('close', () => {
                statusDiv.innerText = "Status: Call ended.";
            });
        }

        // 5. The IPv6 Enforcement Engine
        function enforceIPv6Only(rtcPeerConnection) {
            if (!rtcPeerConnection) return;

            rtcPeerConnection.oniceconnectionstatechange = () => {
                console.log("ICE Connection State changed:", rtcPeerConnection.iceConnectionState);
                statusDiv.innerText = `ICE State: ${rtcPeerConnection.iceConnectionState}`;

                if (rtcPeerConnection.iceConnectionState === 'failed') {
                    statusDiv.innerHTML = "<span style='color:red;'>Connection Failed! Carrier firewalls blocked direct IPv6 P2P.</span>";
                }
            };

            const originalAddIceCandidate = rtcPeerConnection.addIceCandidate.bind(rtcPeerConnection);
            
            rtcPeerConnection.addIceCandidate = function(candidate) {
                if (candidate && candidate.candidate) {
                    const cStr = candidate.candidate;

                    if (cStr.includes('typ relay')) {
                        console.log("⚠️ Blocked Relay Candidate:", cStr);
                        return Promise.resolve(); 
                    }

                    const tokens = cStr.split(' ');
                    const ipAddress = tokens[4]; // Extract structural IP value from ICE metric
                    
                    if (ipAddress && !ipAddress.includes(':')) {
                        console.log("⚠️ Dropped IPv4 Candidate:", ipAddress);
                        return Promise.resolve(); 
                    }
                    
                    console.log("✅ Allowed IPv6 Candidate:", ipAddress);
                }
                return originalAddIceCandidate(candidate);
            };
        }

        // Start execution instantly on page load
        initPeer();
    </script>
</body>
</html>
