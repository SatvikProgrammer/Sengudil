<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict IPv6 P2P Video Call 3</title>
    <!-- Include PeerJS Library via CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; margin: 20px; background: #f4f4f9; color: #333; }
        .video-container { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 20px; }
        video { width: 45%; max-width: 400px; min-height: 240px; background: #000; border-radius: 8px; transform: scaleX(-1); }
        .controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin-top: 10px; max-width: 90%; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #status { font-weight: bold; margin-top: 15px; color: #666; }
    </style>
</head>
<body>

    <h2>Strict IPv6 P2P Video Call</h2>
    <p>Testing true serverless P2P over cellular networks</p>

    <div class="controls">
        <div><strong>Your Peer ID:</strong> <span id="my-id" style="color:#007bff;">Generating...</span></div>
        <br>
        <input type="text" id="remote-id" placeholder="Paste Remote Peer ID here">
        <button id="call-btn">Start IPv6 Video Call</button>
        <div id="status">Status: Requesting camera permissions...</div>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Video</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote Video</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const myIdSpan = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const callBtn = document.getElementById('call-btn');

        let localStream = null;
        let peer = null;

        // FIXED PARAMETERS: This allows communication with the PeerJS signaling 
        // cloud broker properly while passing our strict direct P2P connection constraints.
        const peerOptions = {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            path: '/',
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ],
                iceTransportPolicy: 'all'
            },
            debug: 3 // Enables verbose logging to the browser console to trace connection paths
        };

        // 1. First get media permissions to prevent stream initialization racing issues
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                statusDiv.innerText = "Camera ready. Establishing signaling network connection...";
                initPeerConnectionSystem();
            })
            .catch(err => {
                console.error("Camera Error:", err);
                statusDiv.innerHTML = `<span style='color:red;'>Camera Error: ${err.message}. Please reload and grant hardware access.</span>`;
            });

        // 2. Initialize PeerJS once media is locked
        function initPeerConnectionSystem() {
            peer = new Peer(peerOptions);

            peer.on('open', (id) => {
                myIdSpan.innerText = id;
                statusDiv.innerText = "Status: Online! Ready to link using direct IPv6 pathways.";
            });

            peer.on('error', (err) => {
                console.error("PeerJS Core Error:", err);
                statusDiv.innerText = `Network Error: ${err.type}`;
            });

            // Catch and handle incoming connection requests
            peer.on('call', (incomingCall) => {
                statusDiv.innerText = "Incoming request detected. Inspecting connectivity maps...";
                
                // Hook direct network validation mechanisms
                applyStrictIPv6Filter(incomingCall.peerConnection);

                incomingCall.answer(localStream);
                bindCallStreams(incomingCall);
            });
        }

        // 3. Fire outgoing connection requests
        callBtn.onclick = () => {
            const destinationId = remoteIdInput.value.trim();
            if (!destinationId) {
                alert("Please paste a valid Remote Peer ID first.");
                return;
            }
            if (!localStream) {
                alert("Local media stream is missing.");
                return;
            }

            statusDiv.innerText = "Punching direct cellular firewalls via STUN...";
            const outboundCall = peer.call(destinationId, localStream);
            
            applyStrictIPv6Filter(outboundCall.peerConnection);
            bindCallStreams(outboundCall);
        };

        // 4. Attach remote stream elements to HTML layer
        function bindCallStreams(activeCall) {
            activeCall.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerHTML = "<span style='color:green;'>Status: Connected! Streaming directly peer-to-peer over IPv6.</span>";
            });

            activeCall.on('close', () => {
                statusDiv.innerText = "Status: Session disconnected.";
            });
        }

        // 5. The Aggressive IPv6 Traversal Filtering Core
        function applyStrictIPv6Filter(rtcPeerConnection) {
            if (!rtcPeerConnection) return;

            rtcPeerConnection.oniceconnectionstatechange = () => {
                console.log("ICE Connection Infrastructure State:", rtcPeerConnection.iceConnectionState);
                
                if (rtcPeerConnection.iceConnectionState === 'failed') {
                    statusDiv.innerHTML = "<span style='color:red;'>Connection Failed! Direct IPv6 P2P blocked by restrictive network firewalls.</span>";
                }
            };

            const upstreamAddIceCandidate = rtcPeerConnection.addIceCandidate.bind(rtcPeerConnection);
            
            rtcPeerConnection.addIceCandidate = function(candidate) {
                if (candidate && candidate.candidate) {
                    const structuralString = candidate.candidate;

                    // Immediately drop any standard TURN network relays
                    if (structuralString.includes('typ relay')) {
                        console.log("🚫 Dropped Relay Candidate:", structuralString);
                        return Promise.resolve(); 
                    }

                    const segmentedTokens = structuralString.split(' ');
                    const parsedIpAddress = segmentedTokens[4]; // Extract precise candidate IP component
                    
                    // Reject traditional IPv4 structures. IPv6 candidates natively contain colons (:)
                    if (parsedIpAddress && !parsedIpAddress.includes(':')) {
                        console.log("🚫 Blocked IPv4 Route:", parsedIpAddress);
                        return Promise.resolve(); 
                    }
                    
                    console.log("🚀 Injecting Valid IPv6 Path:", parsedIpAddress);
                }
                return upstreamAddIceCandidate(candidate);
            };
        }
    </script>
</body>
</html>
