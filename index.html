<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict g IPv6 Cross-Network P2P</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin: 20px; background: #f4f4f9; color: #333; }
        .video-container { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 20px; }
        video { width: 45%; max-width: 400px; min-height: 240px; background: #000; border-radius: 8px; transform: scaleX(-1); }
        .controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin-top: 10px; width: 90%; max-width: 600px; }
        textarea { width: 90%; height: 100px; margin: 10px 0; font-family: monospace; font-size: 11px; background: #fafafa; }
        button { padding: 10px 20px; margin: 5px; font-size: 14px; border-radius: 4px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-green { background: #28a745; }
        .btn-green:hover { background: #218838; }
        #status { font-weight: bold; margin-top: 15px; color: #ff6b6b; }
        .log-box { text-align: left; background: #222; color: #0f0; padding: 10px; border-radius: 4px; font-family: monospace; max-height: 150px; overflow-y: auto; font-size: 11px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Strict IPv6 Cross-Network Video Tester</h2>
    <p>Ensures connection paths and media maps compile fully before handshake generation.</p>

    <div class="controls">
        <div id="status">Status: Click "Initialize System" to start.</div>
        <button id="init-btn" class="btn-green">1. Initialize System</button>
        <br><br>
        
        <div><strong>Step 2:</strong> Creator clicks Offer and WAITS for compilation. Connector pastes code below and answers.</div>
        <button id="offer-btn" disabled>Create Local Offer Connection Code</button>
        <button id="answer-btn" disabled>Process Remote Code & Answer</button>
        
        <textarea id="sdp-box" placeholder="Connection data codes will appear here once network addresses compile..."></textarea>
        
        <div class="log-box" id="log-box">Logs:<br></div>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Video</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote Video</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const sdpBox = document.getElementById('sdp-box');
        const logBox = document.getElementById('log-box');
        
        const initBtn = document.getElementById('init-btn');
        const offerBtn = document.getElementById('offer-btn');
        const answerBtn = document.getElementById('answer-btn');

        let localStream = null;
        let pc = null;

        function log(msg) {
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // RESTORED WORKING SYNTAX: Reverted to individual object configuration layout
        const rtcConfig = {
            iceServers: [
                { urls: "stun:://google.com" },
                { urls: "stun:://google.com" }
            ],
            iceTransportPolicy: 'all'
        };

        initBtn.onclick = async () => {
            try {
                statusDiv.innerText = "Requesting media...";
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                
                log("Camera initialized successfully.");
                setupPeerConnection();
                
                initBtn.disabled = true;
                offerBtn.disabled = false;
                answerBtn.disabled = false;
                statusDiv.innerText = "Status: Ready. Proceed to Step 2.";
                statusDiv.style.color = "green";
            } catch (err) {
                log(`Initialization Error: ${err.message}`);
                statusDiv.innerText = `Error: ${err.message}`;
            }
        };

        function setupPeerConnection() {
            pc = new RTCPeerConnection(rtcConfig);

            // Bind tracks to connection object immediately
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                log("Success: Incoming remote video track received!");
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                } else {
                    if (!remoteVideo.srcObject) {
                        remoteVideo.srcObject = new MediaStream([event.track]);
                    } else {
                        remoteVideo.srcObject.addTrack(event.track);
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                log(`ICE Connection State: ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'connected') {
                    statusDiv.innerText = "Connected! Video should be streaming.";
                    statusDiv.style.color = "green";
                }
                if (pc.iceConnectionState === 'failed') {
                    statusDiv.innerText = "Connection Failed! IPv6 route was firewalled.";
                    statusDiv.style.color = "red";
                }
            };

            // TRACKING THE NETWORK COMPILE STATE
            pc.onicegatheringstatechange = () => {
                log(`Network Candidate Gathering State: ${pc.iceGatheringState}`);
                if (pc.iceGatheringState === 'complete') {
                    log("✅ Network layout fully compiled! Code updated in text block.");
                    sdpBox.value = btoa(JSON.stringify(pc.localDescription));
                    statusDiv.innerText = "Status: Code fully compiled! Ready to copy.";
                }
            };

            // STRICT FILTER ENGINE
            const originalAddIceCandidate = pc.addIceCandidate.bind(pc);
            pc.addIceCandidate = function(candidate) {
                if (candidate && candidate.candidate) {
                    const cStr = candidate.candidate;

                    if (cStr.includes('typ relay')) {
                        log("🚫 Blocked Relay Candidate");
                        return Promise.resolve();
                    }

                    const tokens = cStr.split(' ');
                    const ip = tokens[4];

                    if (ip && ip.includes(':')) {
                        log(`🚀 Injecting Valid IPv6 Path: ${ip}`);
                        return originalAddIceCandidate(candidate);
                    } else {
                        log(`🚫 Dropped IPv4 Route: ${ip}`);
                        return Promise.resolve();
                    }
                }
                return originalAddIceCandidate(candidate);
            };
        }

        offerBtn.onclick = async () => {
            log("Generating local connection offer... compiling addresses...");
            try {
                statusDiv.innerText = "Status: Gathering network routes... PLEASE WAIT.";
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
            } catch (e) {
                log(`Offer Generation Failure: ${e.message}`);
            }
        };

        answerBtn.onclick = async () => {
            const rawInput = sdpBox.value.trim();
            if (!rawInput) {
                alert("Please paste the connection code into the textarea first.");
                return;
            }

            try {
                const remoteDesc = JSON.parse(atob(rawInput));
                await pc.setRemoteDescription(new RTCSessionDescription(remoteDesc));

                if (remoteDesc.type === 'offer') {
                    log("Processing offer code... compiling matching answer tracks...");
                    statusDiv.innerText = "Status: Compiling answer routes... PLEASE WAIT.";
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                } else if (remoteDesc.type === 'answer') {
                    log("Processing answer code... Finalizing connection handshake...");
                    statusDiv.innerText = "Status: Finalizing handshake maps...";
                }
            } catch (err) {
                log(`Handshake Error: ${err.message}`);
                alert("Invalid connection code structure.");
            }
        };
    </script>
</body>
</html>
